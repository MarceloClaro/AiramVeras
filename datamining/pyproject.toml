[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airam-datamining"
version = "0.1.0"
description = "Pipeline local auditável CAEd/CNCA–BNCC"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["airam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
